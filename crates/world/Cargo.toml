[package]
name = "world"
version = "0.2.0"
edition = "2021"
description = "Planetary interior, atmosphere, climate, ocean, geology, and surface modeling"

[dependencies]
noise = "0.9"
seeded_dice_roller = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]
erosion = []

[dev-dependencies]
serde_json = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

[[bench]]
name = "pipeline"
harness = false
